# Deploy React frontend to GitHub Pages
# Triggers automatically on every push to main/master.
#
# ── One-time setup required ──────────────────────────────────────────────────
# 1. Go to your repo → Settings → Pages
#    Source: "GitHub Actions"
#
# 2. Go to Settings → Secrets and variables → Actions → New repository secret:
#    Name:  VITE_API_URL
#    Value: https://YOUR-APP-NAME.onrender.com   (your Render backend URL)
#
# After that, every `git push` auto-deploys the frontend to GitHub Pages AND
# Render auto-redeploys the backend. Zero manual steps.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Frontend → GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:      # also allow manual trigger from GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Points the frontend at your Render backend
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # Tells vite.config.ts to use /TallyToInsights/ as the base path
          VITE_DEPLOY_TARGET: github-pages
          # Tells React Router to use /TallyToInsights as basename
          VITE_BASE_PATH: /TallyToInsights
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
