# Render deployment config — https://render.com/docs/render-yaml-spec
# One-click deploy: connect this repo in Render and it reads this file automatically.
#
# What gets created:
#   • tallytoinsights-api  — Python/FastAPI web service (free tier)
#   • tallytoinsights-db   — PostgreSQL 16 database (free tier, 1 GB)

services:
  - type: web
    name: tallytoinsights-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health

    envVars:
      # Render auto-injects the PostgreSQL connection string here
      - key: DATABASE_URL
        fromDatabase:
          name: tallytoinsights-db
          property: connectionString

      # A random 32-byte secret for JWT signing — Render generates this once and keeps it
      - key: SECRET_KEY
        generateValue: true

      # Allow requests from your GitHub Pages frontend.
      # After your first deploy, update this with your exact Render URL too if needed.
      - key: CORS_ORIGINS
        value: "https://perirrs.github.io,http://localhost:5173"

      # Upload files to /tmp (ephemeral but fine — files are parsed immediately into the DB)
      - key: UPLOAD_DIR
        value: /tmp/tally_uploads

databases:
  - name: tallytoinsights-db
    databaseName: tallytoinsights
    user: tallytoinsights
    plan: free        # 90-day free trial on Render, then $7/mo — or use Supabase free PG
    region: oregon
